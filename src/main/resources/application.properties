spring.application.name=StudySheet
server.port=4000

# Default profile uses H2 file-based DB (survives restarts, zero setup)
spring.datasource.url=jdbc:h2:file:./data/studysheet;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# H2 web console at http://localhost:9990/h2-console (dev convenience)
spring.h2.console.enabled=true

# Thymeleaf: disable cache during development for instant template reloads
spring.thymeleaf.cache=false

# ── Storage (Option C: DB is source of truth, notes mirrored as portable .md files) ──
# backend: "local" now. Add an R2ObjectStorage bean + set this to "r2" to switch later.
studysheet.storage.backend=local
studysheet.storage.local.base-dir=./data/objectstore
studysheet.mirror.enabled=true

