<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
    <title th:text="${title} + ' · StudySheet'">StudySheet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
        // Apply saved theme before paint to avoid flash
        if (localStorage.getItem('theme') === 'dark' ||
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <!-- Prism.js for code syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet"/>
    <style>
        html { scroll-behavior: smooth; }
        .prose pre { position: relative; background:#1e1e2e; color:#cdd6f4; padding:1.25rem 1rem 1rem 1rem; border-radius:.75rem; overflow-x:auto; -webkit-overflow-scrolling: touch; }
        .prose code:not(pre code) { background:rgba(99,102,241,.12); color:#4f46e5; padding:.2rem .4rem; border-radius:.375rem; font-size:.875em; font-family: ui-monospace, monospace; }
        .dark .prose code:not(pre code) { background:rgba(129,140,248,.18); color:#818cf8; }
        .prose h1{font-size:1.85rem;font-weight:800;margin:1.5rem 0 .75rem; color: inherit;}
        .prose h2{font-size:1.45rem;font-weight:700;margin:1.35rem 0 .6rem; color: inherit; border-bottom: 1px solid rgba(156,163,175,0.2); padding-bottom: 0.3rem;}
        .prose h3{font-size:1.2rem;font-weight:600;margin:1.1rem 0 .5rem; color: inherit;}
        .prose p{margin:.75rem 0;line-height:1.75}
        .prose ul{list-style:disc;margin:.6rem 0 .6rem 1.5rem}
        .prose ol{list-style:decimal;margin:.6rem 0 .6rem 1.5rem}
        .prose a{color:#4f46e5;text-decoration:underline; font-weight: 500;}
        .dark .prose a{color:#818cf8;}
        .prose blockquote{border-left:4px solid #6366f1; background: rgba(99,102,241,0.05); border-radius: 0 .5rem .5rem 0; padding:.75rem 1rem; color:inherit; margin:.9rem 0}
        .prose table{border-collapse:collapse;margin:1rem 0; width: 100%; display: block; overflow-x: auto; -webkit-overflow-scrolling: touch;}
        .prose th,.prose td{border:1px solid #e5e7eb;padding:.5rem .85rem}
        .dark .prose th,.dark .prose td{border-color:#374151;}
        .prose th { background: rgba(156,163,175,0.1); font-weight: 600; }
        
        /* Interactive Self-Quiz Details & Callouts */
        .prose details { background: rgba(99,102,241,0.06); border: 1px solid rgba(99,102,241,0.2); border-radius: 0.75rem; padding: 0.75rem 1rem; margin: 1rem 0; transition: all 0.2s ease; }
        .prose details[open] { background: rgba(99,102,241,0.09); }
        .prose summary { font-weight: 600; cursor: pointer; color: #4f46e5; user-select: none; }
        .dark .prose summary { color: #818cf8; }
        .prose summary:hover { text-decoration: underline; }

        /* Copy code button hover styling */
        .code-copy-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(255,255,255,0.15);
            color: #a6adc8;
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 0.375rem;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }
        .code-copy-btn:hover { background: rgba(255,255,255,0.25); color: #fff; }

        /* Mermaid Diagram Hover & Click-to-Expand */
        .mermaid-container { position: relative; cursor: pointer; }
        .mermaid-container:hover::after {
            content: "🔍 Click to expand full-screen";
            position: absolute;
            bottom: 0.5rem;
            right: 0.5rem;
            background: rgba(15, 23, 42, 0.85);
            color: #f8fafc;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 0.375rem;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        /* Crisp Mermaid Diagram Node & Label Contrast */
        .mermaid svg { max-width: 100% !important; height: auto !important; font-family: inherit !important; }
        .mermaid .node rect, .mermaid .node circle, .mermaid .node polygon, .mermaid .node path {
            fill: #e0e7ff !important;
            stroke: #4f46e5 !important;
            stroke-width: 2px !important;
        }
        .dark .mermaid .node rect, .dark .mermaid .node circle, .dark .mermaid .node polygon, .dark .mermaid .node path {
            fill: #1e1b4b !important;
            stroke: #818cf8 !important;
            stroke-width: 2px !important;
        }
        .mermaid .node .label, .mermaid .node text, .mermaid .node span, .mermaid .node tspan, .mermaid .label text {
            fill: #1e1b4b !important;
            color: #1e1b4b !important;
            font-weight: 600 !important;
            font-size: 13px !important;
        }
        .dark .mermaid .node .label, .dark .mermaid .node text, .dark .mermaid .node span, .dark .mermaid .node tspan, .dark .mermaid .label text {
            fill: #e0e7ff !important;
            color: #e0e7ff !important;
            font-weight: 600 !important;
            font-size: 13px !important;
        }
        .mermaid .edgePath .path, .mermaid .flowchart-link { stroke: #6366f1 !important; stroke-width: 2px !important; }
        .dark .mermaid .edgePath .path, .dark .mermaid .flowchart-link { stroke: #818cf8 !important; stroke-width: 2px !important; }
        .mermaid .marker { fill: #6366f1 !important; stroke: #6366f1 !important; }
        .dark .mermaid .marker { fill: #818cf8 !important; stroke: #818cf8 !important; }
        .mermaid .edgeLabel, .mermaid .edgeLabel span { background-color: #ffffff !important; color: #374151 !important; font-weight: 500 !important; }
        .dark .mermaid .edgeLabel, .dark .mermaid .edgeLabel span { background-color: #111827 !important; color: #d1d5db !important; font-weight: 500 !important; }
    </style>
</head>

<body>
<nav th:fragment="nav" class="border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 sticky top-0 z-40 shadow-xs">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
        <!-- Logo & Brand -->
        <a href="/" class="text-lg font-bold text-indigo-600 dark:text-indigo-400 shrink-0">📚 StudySheet</a>

        <!-- Desktop Nav Links & Search -->
        <div class="hidden md:flex items-center gap-5">
            <a href="/notes" class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition">Notes</a>
            <a href="/topics" class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition">Topics</a>
            <form action="/notes" method="get" class="flex items-center gap-2">
                <input type="text" name="q" placeholder="Search guides…"
                       class="px-3 py-1.5 text-xs rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 dark:text-gray-100 w-44 focus:ring-2 focus:ring-indigo-500 outline-hidden transition"/>
            </form>
            <button type="button" onclick="toggleTheme()" title="Toggle theme"
                    class="text-gray-500 dark:text-gray-300 text-lg hover:opacity-80 transition cursor-pointer">🌓</button>
        </div>

        <!-- Mobile Controls (Hamburger + Quick Theme Toggle) -->
        <div class="flex md:hidden items-center gap-2">
            <button type="button" onclick="toggleTheme()" title="Toggle theme"
                    class="text-gray-500 dark:text-gray-300 text-lg p-1">🌓</button>
            <button type="button" id="mobile-menu-btn" onclick="toggleMobileMenu()"
                    class="p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                <span class="text-xl">☰</span>
            </button>
        </div>
    </div>

    <!-- Mobile Collapsible Menu Drawer -->
    <div id="mobile-menu" class="hidden md:hidden border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 px-4 py-3 space-y-3">
        <form action="/notes" method="get" class="w-full">
            <input type="text" name="q" placeholder="Search guides…"
                   class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 dark:text-gray-100"/>
        </form>
        <div class="grid grid-cols-2 gap-2 text-sm font-medium">
            <a href="/notes" class="p-2.5 rounded-lg border border-gray-200 dark:border-gray-800 text-center hover:bg-gray-50 dark:hover:bg-gray-800">📝 All Notes</a>
            <a href="/topics" class="p-2.5 rounded-lg border border-gray-200 dark:border-gray-800 text-center hover:bg-gray-50 dark:hover:bg-gray-800">🗂️ Topics</a>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const el = document.documentElement;
            el.classList.toggle('dark');
            localStorage.setItem('theme', el.classList.contains('dark') ? 'dark' : 'light');
            if (typeof window.onThemeToggle === 'function') {
                window.onThemeToggle();
            }
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            if (menu) menu.classList.toggle('hidden');
        }
    </script>
</nav>

<footer th:fragment="scripts">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</footer>
</body>
</html>
