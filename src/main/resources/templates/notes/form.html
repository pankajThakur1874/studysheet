<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit note')}"></head>
<body class="bg-[#faf9f6] dark:bg-[#0B0C0E] text-slate-900 dark:text-[#EDEDE9] min-h-screen">
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="max-w-5xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6" th:text="${note.id == null} ? 'New note' : 'Edit note'">New note</h1>

    <form th:action="@{/notes}" method="post" th:object="${note}" class="space-y-5">
        <input type="hidden" th:field="*{id}"/>

        <div>
            <label class="block text-sm font-medium mb-1">Title</label>
            <input type="text" th:field="*{title}" required
                   class="w-full px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800"/>
            <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-red-600 text-xs mt-1"></p>
        </div>

        <div class="grid sm:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Topic</label>
                <select name="topicId"
                        class="w-full px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800">
                    <option value="">— none —</option>
                    <option th:each="t : ${topics}" th:value="${t.id}" th:text="${t.name}"
                            th:selected="${note.topic != null and note.topic.id == t.id}">Topic</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Study Status</label>
                <select th:field="*{status}"
                        class="w-full px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800">
                    <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.displayName}"
                            th:selected="${note.status == st}">Status</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Tags <span class="text-gray-400">(comma separated)</span></label>
                <input type="text" name="tagsCsv" th:value="${tagsCsv}" placeholder="java, spring, jpa"
                       class="w-full px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800"/>
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Content (Markdown)</label>
                <textarea id="md" th:field="*{contentMd}" rows="20"
                          oninput="renderPreview()"
                          class="w-full px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 font-mono text-sm"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Live preview</label>
                <div id="preview" class="prose max-w-none p-3 rounded-md border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 min-h-[10rem] overflow-auto"></div>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md">Save</button>
            <a href="/notes" class="px-4 py-2 rounded-md border border-gray-300 dark:border-gray-600">Cancel</a>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
    let renderTimer;
    function renderPreview() {
        clearTimeout(renderTimer);
        renderTimer = setTimeout(() => {
            const src = document.getElementById('md').value;
            const previewEl = document.getElementById('preview');
            previewEl.innerHTML = marked.parse(src || '');
            if (window.Prism) Prism.highlightAllUnder(previewEl);

            if (window.mermaid) {
                previewEl.querySelectorAll("pre code.language-mermaid").forEach(codeBlock => {
                    const pre = codeBlock.parentElement;
                    const div = document.createElement("div");
                    div.className = "mermaid flex justify-center my-4 p-3 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900";
                    div.textContent = codeBlock.textContent;
                    pre.replaceWith(div);
                });
                try {
                    mermaid.initialize({ startOnLoad: false, theme: document.documentElement.classList.contains("dark") ? "dark" : "default" });
                    mermaid.run({ querySelector: '#preview .mermaid' });
                } catch (e) {}
            }
        }, 150);
    }
    renderPreview();
</script>
</body>
</html>
