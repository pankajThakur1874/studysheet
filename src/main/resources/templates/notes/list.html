<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notes')}"></head>
<body class="bg-[#faf9f6] dark:bg-[#0B0C0E] text-slate-900 dark:text-[#EDEDE9] min-h-screen">
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-stone-200 dark:border-[#1E2126]">
        <div>
            <h1 class="text-2xl sm:text-3xl font-medium tracking-tight text-slate-900 dark:text-[#EDEDE9]" th:text="${heading}">All Notes</h1>
            <p class="font-mono text-xs text-slate-400 dark:text-[#6B7280] mt-1">Organized folder-wise by chapter & architecture topic</p>
        </div>

        <!-- Resync Button & View Switcher Tabs -->
        <div class="flex items-center gap-2.5 self-start sm:self-auto font-mono text-xs">
            <form action="/topics/sync-files" method="post">
                <button type="submit" title="Clean database notes and freshly import latest local files"
                        class="px-3.5 py-2 rounded-md border border-stone-300 dark:border-[#2A2E35] bg-stone-100 dark:bg-[#121418] text-slate-800 dark:text-[#EDEDE9] hover:bg-stone-200 dark:hover:bg-[#1A1D23] font-medium transition flex items-center gap-1.5 cursor-pointer shadow-xs">
                    <span>🔄 Clean & Sync</span>
                </button>
            </form>

            <div class="flex items-center p-1 rounded-md bg-stone-200 dark:bg-[#121418] border border-stone-300 dark:border-[#1E2126]">
                <button type="button" id="btn-folder-view" onclick="switchView('folder')"
                        class="px-3 py-1.5 rounded-sm bg-white dark:bg-[#0B0C0E] text-amber-600 dark:text-[#FFB84D] font-bold shadow-xs transition cursor-pointer">
                    📁 Folder View
                </button>
                <button type="button" id="btn-list-view" onclick="switchView('list')"
                        class="px-3 py-1.5 rounded-sm text-slate-600 dark:text-[#6B7280] hover:text-slate-900 dark:hover:text-[#EDEDE9] transition cursor-pointer">
                    📄 Flat List
                </button>
            </div>
        </div>
    </div>

    <!-- Flash Message Notification -->
    <div th:if="${message != null}" class="p-4 rounded-md bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900/60 text-xs font-mono text-amber-800 dark:text-[#FFB84D] flex items-center justify-between shadow-xs">
        <span>✨ <span th:text="${message}">Message</span></span>
    </div>

    <!-- Status Filters -->
    <div class="flex items-center gap-2 text-xs font-mono overflow-x-auto pb-1 -mx-4 px-4 sm:mx-0 sm:px-0 scrollbar-none">
        <span class="text-slate-400 dark:text-[#6B7280] font-medium uppercase tracking-wider shrink-0">Filter:</span>
        <a href="/notes"
           th:class="'px-3 py-1 rounded-sm border transition shrink-0 ' + ${selectedStatus == null ? 'bg-slate-900 text-white dark:bg-[#FFB84D] dark:text-[#0B0C0E] border-transparent font-bold' : 'bg-stone-100 dark:bg-[#121418] text-slate-600 dark:text-[#A2A9B1] border-stone-200 dark:border-[#1E2126] hover:border-amber-500'}">All</a>
        <a th:each="st : ${statuses}" th:href="@{/notes(status=${st})}"
           th:class="'px-3 py-1 rounded-sm border transition shrink-0 ' + ${selectedStatus == st ? 'ring-1 ring-[#FFB84D] font-bold ' + st.badgeCssClass : st.badgeCssClass}"
           th:text="${st.displayName}">Status</a>
    </div>

    <div th:if="${notes.isEmpty()}" class="text-slate-400 font-mono text-xs py-12 text-center border rounded-md bg-white dark:bg-[#0B0C0E] border-stone-200 dark:border-[#1E2126]">
        No notes found matching criteria. Click <a href="/notes" class="text-amber-600 dark:text-[#FFB84D] underline">here</a> to reset filters.
    </div>

    <!-- 1. FOLDER-WISE VIEW (Default) -->
    <div id="view-folder" class="space-y-8">
        <div th:each="entry : ${groupedNotes}"
             class="rounded-md border border-stone-200 dark:border-[#1E2126] bg-white dark:bg-[#0B0C0E] shadow-xs overflow-hidden transition">
            
            <!-- Folder Header Card -->
            <div class="p-6 border-b border-stone-200 dark:border-[#1E2126] bg-stone-50/60 dark:bg-[#121418]/60 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="space-y-1">
                    <div class="flex items-center gap-2">
                        <span class="text-xl">📁</span>
                        <h2 class="text-lg font-medium text-slate-900 dark:text-[#EDEDE9]" th:text="${entry.key.name}">Folder Name</h2>
                    </div>
                    <p class="text-xs text-slate-500 dark:text-[#8E959D]" th:text="${entry.key.description != null and !entry.key.description.isBlank()} ? ${entry.key.description} : 'Folder containing study guides'"></p>
                </div>
                <div class="flex items-center gap-2 self-start sm:self-auto font-mono">
                    <span class="px-3 py-1 rounded-sm bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-[#FFB84D] border border-amber-200 dark:border-amber-900/60 text-xs font-bold"
                          th:text="${entry.value.size()} + ' Guides'">0 Guides</span>
                </div>
            </div>

            <!-- Folder Document List -->
            <div class="p-4 grid gap-3 sm:grid-cols-2">
                <a th:each="n, stat : ${entry.value}" th:href="@{/notes/{id}(id=${n.id})}"
                   class="block p-4 rounded-sm border border-stone-200 dark:border-[#1E2126] bg-white dark:bg-[#0B0C0E] hover:border-amber-500 dark:hover:border-[#FFB84D] hover:bg-stone-50/50 dark:hover:bg-[#121418]/50 transition">
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <span class="flex items-center justify-center w-5 h-5 rounded-full bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-[#FFB84D] font-mono text-xs font-bold shrink-0"
                                  th:text="${stat.count}">1</span>
                            <span class="text-xs font-semibold text-slate-900 dark:text-[#EDEDE9] truncate hover:text-amber-600 dark:hover:text-[#FFB84D] transition"
                                  th:text="${n.title}">Note Title</span>
                        </div>
                        <span th:class="'text-[0.65rem] px-2 py-0.5 rounded-sm border font-mono font-semibold shrink-0 ' + ${n.status.badgeCssClass}"
                              th:text="${n.status.displayName}">Status</span>
                    </div>
                    <div class="flex items-center justify-between gap-2 mt-3 pt-2.5 border-t border-stone-100 dark:border-[#16191D] font-mono text-[0.7rem] text-slate-400 dark:text-[#6B7280]">
                        <span th:text="'⏱️ ' + ${n.estimatedReadingTime}">Read time</span>
                        <span th:text="'Updated ' + ${n.updatedAtDisplay}">date</span>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <!-- 2. FLAT LIST VIEW (Hidden by default) -->
    <div id="view-list" class="hidden space-y-3">
        <ul class="space-y-3">
            <li th:each="n : ${notes}"
                class="p-4 rounded-sm border border-stone-200 dark:border-[#1E2126] bg-white dark:bg-[#0B0C0E] hover:border-amber-500 dark:hover:border-[#FFB84D] transition">
                <a th:href="@{/notes/{id}(id=${n.id})}" class="block">
                    <div class="flex items-center justify-between gap-3">
                        <div class="flex items-center gap-2 min-w-0">
                            <span th:if="${n.pinned}" title="Pinned">📌</span>
                            <span class="font-medium text-sm text-slate-900 dark:text-[#EDEDE9] truncate" th:text="${n.title}">Title</span>
                        </div>
                        <span th:class="'text-xs px-2.5 py-0.5 rounded-sm border font-mono font-semibold shrink-0 ' + ${n.status.badgeCssClass}"
                              th:text="${n.status.displayName}">Status</span>
                    </div>
                    <div class="flex flex-wrap items-center gap-2 mt-2.5 font-mono text-xs text-slate-400 dark:text-[#6B7280]">
                        <span th:if="${n.topic != null}"
                              class="px-2 py-0.5 rounded-sm bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-[#FFB84D] font-medium"
                              th:text="${n.topic.name}">Topic</span>
                        <span class="px-2 py-0.5 rounded-sm bg-stone-100 dark:bg-[#121418] text-slate-600 dark:text-[#A2A9B1] font-medium"
                              th:text="'⏱️ ' + ${n.estimatedReadingTime}">⏱️ 2 min read</span>
                        <span th:each="tag : ${n.tags}"
                              class="px-2 py-0.5 rounded-sm bg-stone-100 dark:bg-[#121418]"
                              th:text="'#' + ${tag.name}">#tag</span>
                        <span th:text="'· updated ' + ${n.updatedAtDisplay}">date</span>
                    </div>
                </a>
            </li>
        </ul>
    </div>
</main>

<script>
    function switchView(mode) {
        const folderView = document.getElementById('view-folder');
        const listView = document.getElementById('view-list');
        const btnFolder = document.getElementById('btn-folder-view');
        const btnList = document.getElementById('btn-list-view');

        if (mode === 'folder') {
            folderView.classList.remove('hidden');
            listView.classList.add('hidden');

            btnFolder.className = 'px-3 py-1.5 rounded-sm bg-white dark:bg-[#0B0C0E] text-amber-600 dark:text-[#FFB84D] font-bold shadow-xs transition cursor-pointer';
            btnList.className = 'px-3 py-1.5 rounded-sm text-slate-600 dark:text-[#6B7280] hover:text-slate-900 dark:hover:text-[#EDEDE9] transition cursor-pointer';
        } else {
            folderView.classList.add('hidden');
            listView.classList.remove('hidden');

            btnList.className = 'px-3 py-1.5 rounded-sm bg-white dark:bg-[#0B0C0E] text-amber-600 dark:text-[#FFB84D] font-bold shadow-xs transition cursor-pointer';
            btnFolder.className = 'px-3 py-1.5 rounded-sm text-slate-600 dark:text-[#6B7280] hover:text-slate-900 dark:hover:text-[#EDEDE9] transition cursor-pointer';
        }
    }
</script>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
