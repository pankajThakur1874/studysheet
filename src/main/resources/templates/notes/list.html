<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notes')}"></head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen">
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="max-w-5xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-bold" th:text="${heading}">All notes</h1>
    </div>

    <!-- Topic Syllabus Card (when viewing a specific topic) -->
    <div th:if="${selectedTopic != null}" class="mb-8 p-6 rounded-xl border border-indigo-200 dark:border-indigo-900 bg-gradient-to-br from-indigo-50/70 to-white dark:from-indigo-950/40 dark:to-gray-900 shadow-sm">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-4 border-b border-indigo-100 dark:border-indigo-900/50">
            <div>
                <div class="flex items-center gap-2">
                    <span class="text-xl">🗂️</span>
                    <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100" th:text="${selectedTopic.name}">Topic Name</h2>
                </div>
                <p class="text-xs text-gray-600 dark:text-gray-400 mt-1" th:text="${selectedTopic.description != null and !selectedTopic.description.isBlank()} ? ${selectedTopic.description} : 'Complete study syllabus for this topic.'">Description</p>
            </div>
            <span class="px-3 py-1 text-xs rounded-full bg-indigo-600 text-white font-semibold self-start sm:self-auto" th:text="${notes.size()} + ' Documents'">0 Documents</span>
        </div>

        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-3">📖 Clickable Document Index</h3>
        <div class="grid gap-2 sm:grid-cols-2">
            <a th:each="n, stat : ${notes}" th:href="@{/notes/{id}(id=${n.id})}"
               class="flex items-center justify-between p-2.5 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 hover:border-indigo-400 dark:hover:border-indigo-600 hover:shadow-sm transition">
                <div class="flex items-center gap-2.5 min-w-0">
                    <span class="flex items-center justify-center w-5 h-5 rounded-full bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-xs font-bold shrink-0" th:text="${stat.count}">1</span>
                    <span class="text-xs font-medium text-gray-900 dark:text-gray-100 truncate hover:text-indigo-600 dark:hover:text-indigo-400" th:text="${n.title}">Note Title</span>
                </div>
                <span th:class="'text-[0.65rem] px-2 py-0.5 rounded-full border font-semibold shrink-0 ml-2 ' + ${n.status.badgeCssClass}"
                      th:text="${n.status.displayName}">Status</span>
            </a>
        </div>
    </div>

    <!-- Status Filters -->
    <div class="flex items-center gap-2 mb-6 text-xs overflow-x-auto pb-1 -mx-4 px-4 sm:mx-0 sm:px-0 scrollbar-none">
        <span class="text-gray-500 font-medium shrink-0">Filter:</span>
        <a href="/notes"
           th:class="'px-3 py-1 rounded-full border transition shrink-0 ' + ${selectedStatus == null ? 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900 border-transparent font-semibold' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-700'}">All</a>
        <a th:each="st : ${statuses}" th:href="@{/notes(status=${st})}"
           th:class="'px-3 py-1 rounded-full border transition shrink-0 ' + ${selectedStatus == st ? 'ring-2 ring-indigo-500 font-bold ' + st.badgeCssClass : st.badgeCssClass}"
           th:text="${st.displayName}">Status</a>
    </div>

    <div th:if="${notes.isEmpty()}" class="text-gray-500 py-6 text-center border rounded-lg bg-white dark:bg-gray-900 border-gray-200 dark:border-gray-800">
        No notes found matching criteria.
    </div>

    <ul class="space-y-3">
        <li th:each="n : ${notes}"
            class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 hover:shadow-md transition">
            <a th:href="@{/notes/{id}(id=${n.id})}" class="block">
                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <span th:if="${n.pinned}" title="Pinned">📌</span>
                        <span class="font-medium text-gray-900 dark:text-gray-100" th:text="${n.title}">Title</span>
                    </div>
                    <span th:class="'text-xs px-2 py-0.5 rounded-full border font-medium ' + ${n.status.badgeCssClass}"
                          th:text="${n.status.displayName}">Status</span>
                </div>
                <div class="flex flex-wrap items-center gap-2 mt-2 text-xs text-gray-500">
                    <span th:if="${n.topic != null}"
                          class="px-2 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300"
                          th:text="${n.topic.name}">Topic</span>
                    <span class="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium"
                          th:text="'⏱️ ' + ${n.estimatedReadingTime}">⏱️ 2 min read</span>
                    <span th:each="tag : ${n.tags}"
                          class="px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800"
                          th:text="'#' + ${tag.name}">#tag</span>
                    <span th:text="'· updated ' + ${n.updatedAtDisplay}">date</span>
                </div>
            </a>
        </li>
    </ul>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
