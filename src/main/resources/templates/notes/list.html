<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notes')}"></head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen">
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="max-w-5xl mx-auto px-4 py-8 space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold" th:text="${heading}">All Notes</h1>
            <p class="text-xs text-gray-500 mt-1">Organized folder-wise by chapter & architecture topic</p>
        </div>

        <!-- Resync Button & View Switcher Tabs -->
        <div class="flex items-center gap-2.5 self-start sm:self-auto">
            <form action="/topics/sync-files" method="post">
                <button type="submit" title="Clean database notes and freshly import latest local files"
                        class="px-3 py-1.5 rounded-xl border border-stone-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-stone-700 dark:text-slate-300 hover:bg-stone-100 dark:hover:bg-slate-800 text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer shadow-xs">
                    <span>🔄 Clean & Sync</span>
                </button>
            </form>

            <div class="flex items-center p-1 rounded-xl bg-gray-200 dark:bg-gray-800 text-xs font-semibold">
                <button type="button" id="btn-folder-view" onclick="switchView('folder')"
                        class="px-3 py-1.5 rounded-lg bg-white dark:bg-gray-900 text-indigo-600 dark:text-indigo-400 shadow-xs transition cursor-pointer">
                    📁 Folder View
                </button>
                <button type="button" id="btn-list-view" onclick="switchView('list')"
                        class="px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition cursor-pointer">
                    📄 Flat List
                </button>
            </div>
        </div>
    </div>

    <!-- Flash Message Notification -->
    <div th:if="${message != null}" class="p-3.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 text-xs font-semibold text-emerald-800 dark:text-emerald-200 flex items-center justify-between shadow-xs">
        <span>✨ <span th:text="${message}">Message</span></span>
    </div>

    <!-- Status Filters -->
    <div class="flex items-center gap-2 text-xs overflow-x-auto pb-1 -mx-4 px-4 sm:mx-0 sm:px-0 scrollbar-none">
        <span class="text-gray-500 font-medium shrink-0">Filter:</span>
        <a href="/notes"
           th:class="'px-3 py-1 rounded-full border transition shrink-0 ' + ${selectedStatus == null ? 'bg-gray-800 text-white dark:bg-gray-200 dark:text-gray-900 border-transparent font-semibold' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-700'}">All</a>
        <a th:each="st : ${statuses}" th:href="@{/notes(status=${st})}"
           th:class="'px-3 py-1 rounded-full border transition shrink-0 ' + ${selectedStatus == st ? 'ring-2 ring-indigo-500 font-bold ' + st.badgeCssClass : st.badgeCssClass}"
           th:text="${st.displayName}">Status</a>
    </div>

    <div th:if="${notes.isEmpty()}" class="text-gray-500 py-8 text-center border rounded-xl bg-white dark:bg-gray-900 border-gray-200 dark:border-gray-800">
        No notes found matching criteria. Click <a href="/notes" class="text-indigo-600 underline">here</a> to reset filters.
    </div>

    <!-- 1. FOLDER-WISE VIEW (Default) -->
    <div id="view-folder" class="space-y-6">
        <div th:each="entry : ${groupedNotes}"
             class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-xs overflow-hidden transition">
            
            <!-- Folder Header Card -->
            <div class="p-5 border-b border-gray-100 dark:border-gray-800/80 bg-gray-50/50 dark:bg-gray-850/50 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="space-y-1">
                    <div class="flex items-center gap-2">
                        <span class="text-xl">📁</span>
                        <h2 class="text-base font-bold text-gray-900 dark:text-gray-100" th:text="${entry.key.name}">Folder Name</h2>
                    </div>
                    <p class="text-xs text-gray-500" th:text="${entry.key.description != null and !entry.key.description.isBlank()} ? ${entry.key.description} : 'Folder containing study guides'"></p>
                </div>
                <div class="flex items-center gap-2 self-start sm:self-auto">
                    <span class="px-3 py-1 rounded-full bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 text-xs font-bold"
                          th:text="${entry.value.size()} + ' Guides'">0 Guides</span>
                </div>
            </div>

            <!-- Folder Document List -->
            <div class="p-4 grid gap-2.5 sm:grid-cols-2">
                <a th:each="n, stat : ${entry.value}" th:href="@{/notes/{id}(id=${n.id})}"
                   class="block p-3.5 rounded-xl border border-gray-200 dark:border-gray-800/80 bg-white dark:bg-gray-900 hover:border-indigo-400 dark:hover:border-indigo-600 hover:shadow-xs transition">
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="flex items-center justify-center w-5 h-5 rounded-full bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-xs font-bold shrink-0"
                                  th:text="${stat.count}">1</span>
                            <span class="text-xs font-semibold text-gray-900 dark:text-gray-100 truncate hover:text-indigo-600"
                                  th:text="${n.title}">Note Title</span>
                        </div>
                        <span th:class="'text-[0.65rem] px-2 py-0.5 rounded-full border font-semibold shrink-0 ' + ${n.status.badgeCssClass}"
                              th:text="${n.status.displayName}">Status</span>
                    </div>
                    <div class="flex items-center justify-between gap-2 mt-2 pt-2 border-t border-gray-100 dark:border-gray-800/60 text-[0.7rem] text-gray-500">
                        <span th:text="'⏱️ ' + ${n.estimatedReadingTime}">Read time</span>
                        <span th:text="'Updated ' + ${n.updatedAtDisplay}">date</span>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <!-- 2. FLAT LIST VIEW (Hidden by default) -->
    <div id="view-list" class="hidden space-y-3">
        <ul class="space-y-3">
            <li th:each="n : ${notes}"
                class="p-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 hover:shadow-md transition">
                <a th:href="@{/notes/{id}(id=${n.id})}" class="block">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <span th:if="${n.pinned}" title="Pinned">📌</span>
                            <span class="font-semibold text-sm text-gray-900 dark:text-gray-100" th:text="${n.title}">Title</span>
                        </div>
                        <span th:class="'text-xs px-2 py-0.5 rounded-full border font-semibold ' + ${n.status.badgeCssClass}"
                              th:text="${n.status.displayName}">Status</span>
                    </div>
                    <div class="flex flex-wrap items-center gap-2 mt-2 text-xs text-gray-500">
                        <span th:if="${n.topic != null}"
                              class="px-2 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 font-medium"
                              th:text="${n.topic.name}">Topic</span>
                        <span class="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium"
                              th:text="'⏱️ ' + ${n.estimatedReadingTime}">⏱️ 2 min read</span>
                        <span th:each="tag : ${n.tags}"
                              class="px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800"
                              th:text="'#' + ${tag.name}">#tag</span>
                        <span th:text="'· updated ' + ${n.updatedAtDisplay}">date</span>
                    </div>
                </a>
            </li>
        </ul>
    </div>
</main>

<script>
    function switchView(mode) {
        const folderView = document.getElementById('view-folder');
        const listView = document.getElementById('view-list');
        const btnFolder = document.getElementById('btn-folder-view');
        const btnList = document.getElementById('btn-list-view');

        if (mode === 'folder') {
            folderView.classList.remove('hidden');
            listView.classList.add('hidden');

            btnFolder.className = 'px-3 py-1.5 rounded-lg bg-white dark:bg-gray-900 text-indigo-600 dark:text-indigo-400 shadow-xs transition cursor-pointer';
            btnList.className = 'px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition cursor-pointer';
        } else {
            folderView.classList.add('hidden');
            listView.classList.remove('hidden');

            btnList.className = 'px-3 py-1.5 rounded-lg bg-white dark:bg-gray-900 text-indigo-600 dark:text-indigo-400 shadow-xs transition cursor-pointer';
            btnFolder.className = 'px-3 py-1.5 rounded-lg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition cursor-pointer';
        }
    }
</script>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
