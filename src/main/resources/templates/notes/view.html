<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${note.title})}"></head>
<body class="bg-[#FAF9F6] dark:bg-[#0B0C0E] text-[#101828] dark:text-[#EDEDE9] min-h-screen font-sans">
<!-- Top 2px Reading Progress Bar -->
<div id="reading-progress-bar" class="fixed top-0 left-0 h-[2px] bg-[#B45309] z-50 transition-all duration-75" style="width: 0%"></div>

<nav th:replace="~{fragments/layout :: nav}"></nav>

<!-- Main Reader Layout Container -->
<main id="main-container" class="w-full max-w-[1800px] mx-auto px-4 sm:px-8 py-6 transition-all duration-300">

    <!-- Flash Message Notification -->
    <div th:if="${message != null}" class="mb-6 p-3.5 rounded border border-[#DDD8CE] bg-white dark:bg-[#121418] text-xs font-mono text-[#B45309] flex items-center justify-between shadow-xs">
        <span>✨ <span th:text="${message}">Message</span></span>
    </div>

    <!-- 3-Column Grid: Course Rail (264px) + Article Column (680px max) + Outline Sidebar (232px) -->
    <div id="content-grid" class="grid grid-cols-1 lg:grid-cols-[264px_minmax(0,1fr)_232px] gap-8 items-start min-h-[900px]">

        <!-- Left Course Rail -->
        <aside id="course-sidebar" class="hidden lg:block sticky top-20 self-start transition-all duration-300 bg-[#F5F2EC] dark:bg-[#121418] border border-[#DDD8CE] dark:border-[#1E2126] rounded-md overflow-hidden font-sans text-xs">
            <!-- Mastery Progress Banner -->
            <div class="p-4 border-b border-[#DDD8CE] dark:border-[#1E2126] space-y-2 bg-[#FAF9F6] dark:bg-[#0B0C0E]">
                <div class="flex items-baseline justify-between font-mono text-xs">
                    <span class="uppercase tracking-widest text-[#8A9099] text-[10.5px]">Mastered</span>
                    <span class="font-bold text-[#101828] dark:text-white" th:text="${masteredCount}"><span class="text-[#8A9099] font-normal" th:text="'/' + ${totalCount}">/149</span></span>
                </div>
                <div class="w-full h-1 bg-[#DDD8CE] dark:bg-[#1E2126] overflow-hidden">
                    <div class="h-full bg-[#B45309] transition-all" th:style="'width: ' + ${masteryPercentage} + '%'"></div>
                </div>
            </div>

            <!-- Folder & Note Tree Accordion -->
            <div class="p-3 space-y-3 max-h-[calc(100vh-10rem)] overflow-y-auto scrollbar-thin">
                <div th:each="entry : ${groupedNotes}" class="space-y-1">
                    <!-- Folder Title Accordion Header -->
                    <div onclick="toggleFolder(this)"
                         class="font-sans text-[13px] font-semibold text-[#101828] dark:text-[#EDEDE9] flex items-center justify-between py-1.5 px-2 rounded hover:bg-[#EFEBE3] dark:hover:bg-[#1E2126] cursor-pointer transition select-none">
                        <div class="flex items-center gap-2 min-w-0">
                            <svg class="folder-arrow shrink-0 transition-transform duration-200" width="12" height="12" viewBox="0 0 12 12" fill="none"
                                 th:style="${note != null and note.topic != null and entry.key.id == note.topic.id} ? 'transform: rotate(90deg)' : 'transform: rotate(0deg)'">
                                <path d="M4.4 2.6L7.8 6l-3.4 3.4" stroke="#8A9099" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <span class="truncate" th:text="${entry.key.name}">Folder Name</span>
                        </div>
                        <span class="font-mono text-[10px] text-[#8A9099]" th:text="${entry.value.size()}">0</span>
                    </div>

                    <!-- Note Items List -->
                    <div th:class="'pl-3 space-y-1 border-l border-[#DDD8CE] dark:border-[#2A2E35] ml-3 transition-all ' + (${note != null and note.topic != null and entry.key.id == note.topic.id} ? '' : 'hidden')">
                        <a th:each="n : ${entry.value}" th:href="@{/notes/{id}(id=${n.id})}"
                           th:class="'flex items-center gap-2.5 px-2 py-1.5 rounded transition text-xs ' + (${note != null and n.id == note.id} ? 'bg-[#EFE7D8] dark:bg-[#1E2126] font-semibold text-[#101828] dark:text-white shadow-[inset_2px_0_0_#B45309]' : 'text-[#4B5563] dark:text-[#A2A9B1] hover:bg-[#EFEBE3]')">
                            <span th:utext="${n.status.svgIconHtml}" class="shrink-0 flex items-center"></span>
                            <span class="truncate" th:text="${n.title}">Note Title</span>
                        </a>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Center Article Reader Column -->
        <div id="article-column" class="flex flex-col justify-between min-w-0 max-w-[680px] mx-auto w-full py-2">

            <!-- Meta Top Line: Breadcrumb + Header Controls -->
            <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
                <!-- Breadcrumb -->
                <div class="flex items-center gap-2 font-mono text-[10.5px] uppercase tracking-widest text-[#8A9099]">
                    <span th:text="${note.topic != null ? note.topic.name : 'StudySheet'}">Distributed Data</span>
                    <span class="text-[#CFC8BC]">/</span>
                    <span class="text-[#B45309]" th:text="${notePositionFormatted}">02 of 18</span>
                </div>

                <!-- Reader Controls (The 3 controls) -->
                <div class="flex items-center gap-2.5">
                    <!-- Status Dropdown with Shape Icon -->
                    <form th:action="@{/notes/{id}/status(id=${note.id})}" method="post" class="inline-flex items-center">
                        <div class="flex items-center gap-2 px-2.5 py-1.5 rounded border border-[#DDD8CE] dark:border-[#2A2E35] bg-white dark:bg-[#121418] text-xs font-medium">
                            <span th:utext="${note.status.svgIconHtml}" class="flex items-center"></span>
                            <select name="status" onchange="this.form.submit()"
                                    class="bg-transparent text-[#101828] dark:text-[#EDEDE9] font-sans font-medium outline-none cursor-pointer">
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.displayName}"
                                        th:selected="${note.status == st}">Status</option>
                            </select>
                        </div>
                    </form>

                    <!-- Save / Bookmark Button -->
                    <form th:action="@{/notes/{id}/bookmark(id=${note.id})}" method="post">
                        <button type="submit" class="flex items-center gap-1.5 px-3 py-1.5 rounded border border-[#DDD8CE] dark:border-[#2A2E35] bg-white dark:bg-[#121418] text-xs font-heading font-medium text-[#101828] dark:text-white hover:border-[#B45309] transition cursor-pointer">
                            <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M6 2.8h8a1 1 0 011 1v13.1l-5-3.3-5 3.3V3.8a1 1 0 011-1z" th:fill="${note.bookmarked ? '#B45309' : 'none'}" stroke="#B45309" stroke-width="1.4" stroke-linejoin="round"/></svg>
                            <span th:text="${note.bookmarked} ? 'Saved' : 'Save'">Save</span>
                        </button>
                    </form>

                    <!-- Focus Mode Toggle Button -->
                    <button type="button" onclick="toggleFocusMode()" id="focus-btn" title="Toggle Focus Mode"
                            class="p-2 rounded border border-[#DDD8CE] dark:border-[#2A2E35] bg-white dark:bg-[#121418] text-[#4B5563] dark:text-[#A2A9B1] hover:text-[#B45309] transition cursor-pointer">
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.2" stroke="currentColor" stroke-width="1.4"/><path d="M10 6.2V10l2.6 1.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                    </button>
                </div>
            </div>

            <!-- Title Block -->
            <div class="space-y-4 pb-6 border-b border-[#DDD8CE] dark:border-[#1E2126]">
                <h1 class="font-heading text-4xl sm:text-5xl font-semibold text-[#101828] dark:text-white leading-[1.06] tracking-tight text-balance" th:text="${note.title}">Single-Leader Replication</h1>
                <div class="flex flex-wrap items-center gap-3 font-mono text-xs text-[#8A9099]">
                    <div class="flex items-center gap-1.5">
                        <svg width="13" height="13" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.2" stroke="#8A9099" stroke-width="1.5"/><path d="M10 6.2V10l2.6 1.7" stroke="#8A9099" stroke-width="1.5" stroke-linecap="round"/></svg>
                        <span th:text="${note.estimatedReadingTime}">14 min</span>
                    </div>
                    <span class="text-[#CFC8BC]">&middot;</span>
                    <span th:text="${note.topic != null ? note.topic.name : 'System Design'}">Chapter 5</span>
                    <span class="text-[#CFC8BC]">&middot;</span>
                    <span class="text-[#B45309] font-medium">Critical for interviews</span>
                </div>
            </div>

            <!-- Prose Article Content (Sits directly on paper at ~680px measure) -->
            <article id="note-article" class="prose w-full text-[#26303B] dark:text-[#EDEDE9] py-6 leading-relaxed font-sans" th:utext="${contentHtml}">
                Rendered markdown content.
            </article>

            <!-- Bottom Sequential Navigation -->
            <div class="mt-12 pt-6 border-t border-[#DDD8CE] dark:border-[#1E2126] flex items-center justify-between gap-6 font-sans text-xs">
                <div>
                    <a th:if="${previousNote != null}" th:href="@{/notes/{id}(id=${previousNote.id})}" class="group flex flex-col gap-1">
                        <span class="font-mono text-[10.5px] uppercase tracking-widest text-[#8A9099] group-hover:text-[#B45309]">&larr; Previous</span>
                        <span class="font-medium text-[#101828] dark:text-white text-sm" th:text="${previousNote.title}">Previous Title</span>
                    </a>
                </div>

                <div>
                    <form th:if="${nextNote != null}" th:action="@{/notes/{id}/master-and-next(id=${note.id})}" method="post">
                        <button type="submit" class="px-5 py-3 rounded bg-[#101828] dark:bg-[#FFB84D] text-[#FAF9F6] dark:text-[#0B0C0E] font-heading font-semibold text-sm hover:opacity-90 transition flex items-center gap-3 cursor-pointer">
                            <svg width="17" height="17" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" fill="#FAF9F6"/><path d="M5.6 9.2l2.3 2.3 4.5-4.6" stroke="#101828" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <div class="flex flex-col text-left">
                                <span>Mastered &mdash; next guide</span>
                                <span class="font-mono text-[10px] uppercase tracking-wider text-[#9AA2AE] dark:text-[#5C636B] font-normal" th:text="${nextNote.title}">Next Title</span>
                            </div>
                        </button>
                    </form>

                    <a th:if="${nextNote == null}" href="/notes"
                       class="px-5 py-3 rounded bg-[#101828] dark:bg-[#FFB84D] text-[#FAF9F6] dark:text-[#0B0C0E] font-heading font-semibold text-sm hover:opacity-90 transition flex items-center gap-2">
                        <span>🎉 Topic Mastered! Return to Index</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Right Outline Sidebar ("On this page") -->
        <aside id="toc-sidebar" class="hidden lg:block sticky top-20 self-start transition-all duration-300 font-sans text-xs space-y-6">
            <div>
                <div class="font-mono text-[10.5px] uppercase tracking-widest text-[#8A9099] mb-3 pb-2 border-b border-[#DDD8CE] dark:border-[#1E2126]">On this page</div>
                <nav id="toc-nav" class="space-y-1">
                    <p id="toc-empty" class="text-[#8A9099] italic font-mono text-xs">No headings in this guide.</p>
                </nav>
            </div>

            <div th:if="${note.tags != null and !note.tags.isEmpty()}" class="pt-4 border-t border-[#DDD8CE] dark:border-[#1E2126] space-y-2">
                <div class="font-mono text-[10.5px] uppercase tracking-widest text-[#8A9099]">Tags</div>
                <div class="flex flex-wrap gap-1.5 font-mono text-[10.5px]">
                    <a th:each="tag : ${note.tags}" th:href="@{/notes(tagId=${tag.id})}"
                       class="px-2 py-1 border border-[#DDD8CE] dark:border-[#2A2E35] rounded text-[#4B5563] dark:text-[#A2A9B1] hover:border-[#B45309] transition"
                       th:text="'#' + ${tag.name}">#ddia</a>
                </div>
            </div>
        </aside>

    </div>
</main>

<!-- Full-Screen Diagram Lightbox Modal -->
<div id="diagram-modal" class="fixed inset-0 z-[100] hidden bg-black/85 backdrop-blur-md flex flex-col items-center justify-center p-4 transition-all duration-300">
    <div class="absolute top-4 right-4 flex items-center gap-2 z-10 font-mono text-xs">
        <button type="button" onclick="zoomDiagram(1.25)" class="px-3 py-1.5 rounded bg-stone-800 text-stone-200 font-semibold">🔍 +</button>
        <button type="button" onclick="zoomDiagram(0.8)" class="px-3 py-1.5 rounded bg-stone-800 text-stone-200 font-semibold">🔍 -</button>
        <button type="button" onclick="resetDiagramZoom()" class="px-3 py-1.5 rounded bg-stone-800 text-stone-200 font-semibold">🔄 Reset</button>
        <button type="button" onclick="downloadDiagramSvg()" class="px-3 py-1.5 rounded bg-[#B45309] text-white font-bold">📥 SVG</button>
        <button type="button" onclick="closeDiagramModal()" class="px-3 py-1.5 rounded bg-rose-600 text-white font-bold">✕ Close</button>
    </div>
    <div id="modal-diagram-container" class="w-full h-full max-w-7xl max-h-[88vh] flex items-center justify-center overflow-auto p-4 cursor-grab"></div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

<script>
    // 1. Reading Progress Bar & TOC Scrollspy
    window.addEventListener("scroll", function() {
        const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = (height > 0) ? (winScroll / height) * 100 : 0;
        const progressBar = document.getElementById("reading-progress-bar");
        if (progressBar) progressBar.style.width = scrolled + "%";

        const headings = document.querySelectorAll("#note-article h1, #note-article h2, #note-article h3");
        let currentHeadingId = "";
        headings.forEach(heading => {
            const top = heading.getBoundingClientRect().top;
            if (top <= 140) {
                currentHeadingId = heading.id;
            }
        });

        if (currentHeadingId) {
            document.querySelectorAll("#toc-nav a").forEach(link => {
                if (link.getAttribute("href") === "#" + currentHeadingId) {
                    link.classList.add("border-l-2", "border-[#B45309]", "pl-2", "font-semibold", "text-[#101828]");
                } else {
                    link.classList.remove("border-l-2", "border-[#B45309]", "pl-2", "font-semibold", "text-[#101828]");
                }
            });
        }
    });

    // 2. Folder Accordion Toggle
    function toggleFolder(headerEl) {
        const list = headerEl.nextElementSibling;
        const arrow = headerEl.querySelector('.folder-arrow');
        if (list) {
            const isHidden = list.classList.contains('hidden');
            if (isHidden) {
                list.classList.remove('hidden');
                if (arrow) arrow.style.transform = 'rotate(90deg)';
            } else {
                list.classList.add('hidden');
                if (arrow) arrow.style.transform = 'rotate(0deg)';
            }
        }
    }

    // 3. Focus Mode Toggle
    let focusModeOn = false;
    function toggleFocusMode() {
        focusModeOn = !focusModeOn;
        const courseSidebar = document.getElementById("course-sidebar");
        const tocSidebar = document.getElementById("toc-sidebar");
        const grid = document.getElementById("content-grid");

        if (focusModeOn) {
            if (courseSidebar) courseSidebar.classList.add("lg:hidden");
            if (tocSidebar) tocSidebar.classList.add("lg:hidden");
            if (grid) grid.classList.remove("lg:grid-cols-[264px_minmax(0,1fr)_232px]");
        } else {
            if (courseSidebar) courseSidebar.classList.remove("lg:hidden");
            if (tocSidebar) tocSidebar.classList.remove("lg:hidden");
            if (grid) grid.classList.add("lg:grid-cols-[264px_minmax(0,1fr)_232px]");
        }
    }

    // 4. Diagram Lightbox
    let currentDiagramScale = 1;
    function openDiagramModal(element) {
        const modal = document.getElementById("diagram-modal");
        const container = document.getElementById("modal-diagram-container");
        if (!modal || !container) return;
        container.innerHTML = element.innerHTML;
        currentDiagramScale = 1;
        modal.classList.remove("hidden");
        document.body.style.overflow = "hidden";
    }

    function closeDiagramModal() {
        const modal = document.getElementById("diagram-modal");
        if (modal) modal.classList.add("hidden");
        document.body.style.overflow = "";
    }

    function zoomDiagram(factor) {
        currentDiagramScale *= factor;
        applyDiagramScale();
    }

    function resetDiagramZoom() {
        currentDiagramScale = 1;
        applyDiagramScale();
    }

    function applyDiagramScale() {
        const container = document.getElementById("modal-diagram-container");
        const svg = container ? container.querySelector("svg") : null;
        if (svg) {
            svg.style.transform = `scale(${currentDiagramScale})`;
            svg.style.transformOrigin = "center center";
            svg.style.transition = "transform 0.15s ease-out";
        }
    }

    document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") closeDiagramModal();
    });

    // 5. Build TOC & Code Copy Buttons
    document.addEventListener("DOMContentLoaded", function() {
        const article = document.getElementById("note-article");
        const tocNav = document.getElementById("toc-nav");
        const tocEmpty = document.getElementById("toc-empty");

        if (article) {
            const headings = article.querySelectorAll("h1, h2, h3");
            if (headings.length > 0) {
                if (tocEmpty) tocEmpty.remove();
                headings.forEach((heading, idx) => {
                    if (!heading.id) {
                        heading.id = "heading-" + idx;
                    }
                    const link = document.createElement("a");
                    link.href = "#" + heading.id;
                    link.textContent = heading.textContent;
                    link.className = heading.tagName === "H3" ? "block py-1 pl-3 text-[#6B7280] hover:text-[#101828]" : "block py-1 text-[#4B5563] hover:text-[#101828]";
                    if (tocNav) tocNav.appendChild(link);
                });
            }

            // Transform Mermaid blocks
            const mermaidBlocks = article.querySelectorAll("pre code.language-mermaid");
            if (mermaidBlocks.length > 0) {
                mermaidBlocks.forEach(codeBlock => {
                    const pre = codeBlock.parentElement;
                    const div = document.createElement("div");
                    div.className = "mermaid mermaid-container flex justify-center items-center my-6 p-4 rounded border border-[#DDD8CE] dark:border-[#1E2126] bg-white dark:bg-[#0B0C0E] cursor-pointer";
                    div.textContent = codeBlock.textContent;
                    div.onclick = function() { openDiagramModal(div); };
                    pre.replaceWith(div);
                });
                if (window.mermaid) {
                    mermaid.initialize({ startOnLoad: true, theme: 'default' });
                }
            }

            // Add Copy buttons to code blocks
            article.querySelectorAll("pre").forEach(pre => {
                if (pre.querySelector("code.language-mermaid")) return;
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "code-copy-btn";
                btn.textContent = "Copy";
                btn.onclick = function() {
                    const code = pre.querySelector("code");
                    navigator.clipboard.writeText(code ? code.innerText : pre.innerText).then(() => {
                        btn.textContent = "Copied!";
                        setTimeout(() => btn.textContent = "Copy", 1800);
                    });
                };
                pre.appendChild(btn);
            });
        }
    });
</script>
</body>
</html>
