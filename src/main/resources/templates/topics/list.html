<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Topics')}"></head>
<body class="bg-[#faf9f6] dark:bg-[#0B0C0E] text-slate-900 dark:text-[#EDEDE9] min-h-screen">
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="max-w-5xl mx-auto px-4 py-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div>
            <h1 class="text-2xl font-bold">🗂️ Study Topics</h1>
            <p class="text-xs text-gray-500 mt-1">Organize your study guides into subject categories</p>
        </div>
        <form action="/topics/sync-files" method="post">
            <button type="submit" class="text-xs font-semibold px-3.5 py-2 rounded-md border border-indigo-300 dark:border-indigo-700 bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-100 transition shadow-sm flex items-center gap-1.5">
                <span>🔄 Sync Local Files</span>
            </button>
        </form>
    </div>

    <!-- Alert / Message -->
    <div th:if="${message}" class="mb-6 p-3.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-300 text-xs font-medium">
        <span th:text="${message}">Message</span>
    </div>

    <!-- Empty State -->
    <div th:if="${topics.isEmpty()}" class="text-gray-500 text-center py-12 border rounded-xl bg-white dark:bg-gray-900 border-gray-200 dark:border-gray-800 text-sm">
        No study topics loaded yet. Click <strong>"🔄 Sync Local Files"</strong> above to import your Markdown study guides!
    </div>

    <!-- Topics Grid Cards -->
    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <div th:each="t : ${topics}"
             class="group relative flex flex-col justify-between p-5 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 hover:border-indigo-300 dark:hover:border-indigo-700 hover:shadow-lg transition-all duration-200">
            <a th:href="@{/notes(topicId=${t.id})}" class="block space-y-2">
                <div class="flex items-center justify-between">
                    <h3 class="font-bold text-lg text-gray-900 dark:text-gray-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition" th:text="${t.name}">Topic Name</h3>
                    <span class="px-2.5 py-1 text-xs rounded-full bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 font-semibold border border-indigo-200 dark:border-indigo-800"
                          th:text="${topicNoteCounts.get(t.id)} + ' docs'">0 docs</span>
                </div>
                <p class="text-xs text-gray-500 line-clamp-2" th:text="${t.description != null and !t.description.isBlank()} ? ${t.description} : 'No description provided.'">Description</p>
            </a>

            <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-100 dark:border-gray-800 text-xs">
                <a th:href="@{/notes(topicId=${t.id})}" class="text-indigo-600 dark:text-indigo-400 font-medium hover:underline flex items-center gap-1">
                    Explore Docs &rarr;
                </a>
                <form th:action="@{/topics/{id}/delete(id=${t.id})}" method="post"
                      onsubmit="return confirm('Delete this topic? Notes will keep their content but lose this topic.');">
                    <button class="text-gray-400 hover:text-rose-600 transition">Delete</button>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
